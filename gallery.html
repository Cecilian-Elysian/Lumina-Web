<!DOCTYPE html>
<!--
  ============================================================
  光影画廊 (gallery.html) — 页面骨架
  ------------------------------------------------------------
  结构说明：
    navbar          → 由 js/navbar.js 统一注入（自动高亮当前页）
    .gallery-hero   → 标题 + 副标题 + 搜索框（暂不接功能）
    .gallery-main   → 相册网格（由 js/gallery.js 动态生成）
    #lightbox       → 复用主页灯箱，点击卡片打开
  ============================================================
-->
<html lang="zh-CN">
<head>
  <!-- 字符编码：必须放在最前 -->
  <meta charset="UTF-8">
  <!-- 视口：手机端按设备宽度渲染 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 主题色：与主页背景一致 -->
  <meta name="theme-color" content="#14161a">
  <!-- 提前与图床建立连接，首图加载提速 -->
  <link rel="preconnect" href="https://7bu.top" crossorigin>
  <link rel="dns-prefetch" href="https://bu.dusays.com">
  <!-- 页面描述 -->
  <meta name="description" content="光影画廊 — 相册式图片展示">
  <!-- 浏览器标签页标题 -->
  <title>光影画廊 · Lumina</title>
  <!-- 外部样式表：先主样式，再图集页专用样式 -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/gallery.css">
</head>
<body>
  <!-- 导航栏由 js/navbar.js 统一注入（自动高亮当前页），无需在此手写 -->

  <!-- ========== Hero 区：标题 + 副标题 + 搜索框 ========== -->
  <section class="gallery-hero">
    <div class="hero-text">
      <h1 class="hero-title">光影画廊</h1>
      <p class="hero-subtitle">定格时间，封存每一次心跳</p>
    </div>
    <div class="hero-search-wrap">
      <label class="hero-search" aria-label="搜索图集">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
          <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input type="text" id="search-input" class="search-input" placeholder="搜索图集名…" autocomplete="off">
      </label>
      <span id="result-count" class="result-count"></span>
    </div>
  </section>

  <!-- ========== 相册网格（由 JS 动态生成） ========== -->
  <main class="gallery-main" aria-label="相册列表">
    <div class="gallery-grid" id="gallery-grid"></div>
    <!-- 无数据时显示（兜底图也没了才会出现） -->
    <p id="gallery-empty" class="gallery-empty hidden">暂无相册</p>
  </main>

  <!-- ========== 页脚（与主页一致） ========== -->
  <footer class="site-footer">
    <p><a href="https://github.com/Cecilian-Elysian/Lumina" target="_blank" rel="noopener">GitHub</a></p>
  </footer>

  <!-- ========== 灯箱（复用主页结构） ========== -->
  <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true" aria-label="图片预览">
    <button id="lb-close" class="lb-btn lb-close" aria-label="关闭预览" title="关闭 (Esc)">×</button>
    <button id="lb-prev"  class="lb-btn lb-prev"  aria-label="上一张" title="上一张 (←)">‹</button>
    <img id="lb-img" class="lb-img" alt="">
    <button id="lb-next"  class="lb-btn lb-next"  aria-label="下一张" title="下一张 (→)">›</button>
    <p id="lb-caption" class="lb-caption"></p>
  </div>

  <!-- 共享模块（utils / api / lightbox，gallery.js 复用） -->
  <script src="js/shared/utils.js" defer></script>
  <script src="js/shared/api.js" defer></script>
  <script src="js/shared/lightbox.js" defer></script>
  <!-- 统一导航栏注入（defer 保证在 DOM 就绪后执行） -->
  <script src="js/navbar.js" defer></script>
  <!-- 脚本：albums → album-runtime → config → gallery（依赖顺序不可换） -->
  <script src="js/albums.js" defer></script>
  <script src="js/album-runtime.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/gallery.js" defer></script>
</body>
</html>
