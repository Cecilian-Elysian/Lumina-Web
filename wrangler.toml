name = "lumina"
compatibility_date = "2024-09-23"

# Cloudflare Pages wrangler.toml — 仅 Pages 兼容字段
# ⚠️ 不要加 [build] 块,那是 wrangler Workers 语法,
# 会让 CF Pages 把整个文件识别为非法并 skip,导致 Build command 不生效。
# Build command / Root directory 由 Settings → Builds 配置。
pages_build_output_dir = "./dist"

# ---- D1 数据库(访客统计 + 图片点赞) ----
# 首次启用:
#   1. npx wrangler d1 create lumina-db
#   2. 把命令输出的 database_id 替换下面的占位值
#   3. npx wrangler d1 execute lumina-db --remote --file schema.sql
# 本地开发(wrangler pages dev)用 miniflare 本地 sqlite,占位 id 也能跑:
#   npx wrangler d1 execute lumina-db --local --file schema.sql
# 未绑定 DB 时接口返回空数据,页面静默降级(不显示统计/点赞,不报错)。
[[d1_databases]]
binding = "DB"
database_name = "lumina-db"
database_id = "00000000-0000-0000-0000-000000000000" # TODO: 替换为 d1 create 输出的真实 id