name: CI

# 只做质量闸门,不做部署。
# 部署由 Cloudflare Pages 的 Git 集成负责(Dashboard → Builds),
# 详见 README「部署」一节 —— 不要在此加 deploy 步骤。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            tools/package-lock.json

      # 不用 `|| npm install`:那会掩盖 lockfile 与 package.json 的漂移
      - run: npm ci

      - name: Typecheck (site + manager)
        run: npm run typecheck

      - name: Typecheck (functions)
        run: npm run typecheck:functions

      - name: Test (site + manager)
        run: npm test

      - name: Install tools deps
        run: npm ci --prefix tools

      - name: Test (tools)
        run: npm --prefix tools test

      - name: Build
        run: npm run build
